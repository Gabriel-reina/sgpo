hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "qgen-grpo"
seed: 42
logging_dir: ./output/logs
output_dir: ./output

checkpoint_config:
  type: file_system
  output_dir: ./checkpoints/${exp_name}

track_with: tensorboard
tracker_kwargs:
  log_dir: ./tensorboard/grpo

num_gpus_per_node: 2
num_nodes: 1

max_steps: 600
save_steps: 100
max_ckpt_to_keep: 0
logging_steps: 1
eval_steps: 100000
resume_from_checkpoint: false

rollout_batch_size: 32
adv_estimator: "grpo"
num_return_sequences_in_group: 8

prompt_length: 640
response_length: 256

ppo_epochs: 1
use_kl_loss: true
kl_loss_coef: 0.001
add_token_level_kl: false
init_kl_coef: 0.0
loss_agg_mode: "seq-mean-token-mean"
entropy_loss_coef: 0

whiten_advantages: false
whiten_rewards: false
dual_clip_loss: false
norm_mean_type: group
norm_std_type: group
use_reward_norm: false
use_reward_scaling: false

pretrain: Qwen/Qwen2.5-3B-Instruct
reward_pretrain: Qwen/Qwen2.5-3B-Instruct

global_template: native

actor_train:
  model_args:
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    lr_scheduler_type: cosine
    weight_decay: 0
    max_grad_norm: 1.0
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 32
    warmup_steps: 20
    save_hf_model: true
  data_args:
    template: native
    dataset_type: json
    file_name:
      - ./data/rl_train.jsonl
    domain_interleave_probs:
      qgen: 1.0
    prompt: prompt
    preprocessing_num_workers: 8
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: true
      save_only_model: true
  device_mapping: list(range(0,2))
  infer_batch_size: 4

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${response_length}
    num_beams: 1
    num_return_sequences: ${num_return_sequences_in_group}
    do_sample: true
    temperature: 1.0
    top_p: 1.0
    top_k: -1
  data_args:
    template: native
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.8
      block_size: 16
      max_model_len: 1024
  device_mapping: list(range(0,2))
  infer_batch_size: 1

reference:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: native
  strategy_args:
    strategy_name: megatron_infer
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
  device_mapping: list(range(0,2))
  infer_batch_size: 8

rewards:
  qgen:
    worker_cls: qgen_sgpo.reward_worker.QgenBM25RewardWorker
    model_args:
      model_name_or_path: ${reward_pretrain}
    data_args:
      template: native
    tag_included: [qgen]
    world_size: 2
    infer_batch_size: 8
